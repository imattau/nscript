[package]
name = "nscript-host-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Production cryptography host implementations for NScript Concord modules"

[dependencies]
base64 = "0.22"
chacha20 = "0.9"
getrandom = "0.3"
hkdf = "0.12"
hmac = "0.12"
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdh", "schnorr"] }
nscript-runtime = { path = "../nscript-runtime" }
serde_json.workspace = true
sha2.workspace = true
subtle = "2"

[dev-dependencies]
nscript-semantics = { path = "../nscript-semantics" }
nscript-syntax = { path = "../nscript-syntax" }
tungstenite.workspace = true
rustls.workspace = true

[lints]
workspace = true
