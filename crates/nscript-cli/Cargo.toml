[package]
name = "nscript-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "nscript"
path = "src/main.rs"

[dependencies]
nscript-ir = { path = "../nscript-ir" }
nscript-modules = { path = "../nscript-modules" }
nscript-runtime = { path = "../nscript-runtime" }
nscript-semantics = { path = "../nscript-semantics" }
nscript-syntax = { path = "../nscript-syntax" }
semver.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[dev-dependencies]
nscript-runtime = { path = "../nscript-runtime", features = ["wasm-engine"] }
