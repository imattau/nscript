[package]
name = "nscript-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "nscript"
path = "src/main.rs"

[dependencies]
bech32 = "0.11"
nscript-host-crypto = { path = "../nscript-host-crypto" }
nscript-ir = { path = "../nscript-ir" }
nscript-modules = { path = "../nscript-modules" }
nscript-napplet = { path = "../nscript-napplet" }
nscript-ncc = { path = "../nscript-ncc" }
nscript-nip34 = { path = "../nscript-nip34" }
nscript-nip5d = { path = "../nscript-nip5d" }
nscript-runtime = { path = "../nscript-runtime" }
nscript-semantics = { path = "../nscript-semantics" }
nscript-syntax = { path = "../nscript-syntax" }
semver.workspace = true
serde_json.workspace = true
sha2.workspace = true
ureq.workspace = true

[lints]
workspace = true

[dev-dependencies]
nscript-runtime = { path = "../nscript-runtime", features = ["wasm-engine"] }
tungstenite.workspace = true
