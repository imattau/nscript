name: Release package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  # The npack release used to pack, verify and publish. Bump deliberately.
  NPACK_REF: v0.9.5

jobs:
  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install npack
        run: cargo install --git https://github.com/imattau/npack --tag "$NPACK_REF" --locked --root "$RUNNER_TEMP/npack" npack

      - name: Build nscript
        run: |
          cargo build --release --locked -p nscript-cli -p nscript-mcp
          cargo build --release --locked --target wasm32-unknown-unknown -p nscript-wasm

      - name: Determine release version
        id: release
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # Refuse a release whose tag disagrees with the workspace version.
      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          found=$(awk -F'"' '/^version *=/ { print $2; exit }' <(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml))
          test "$found" = "$VERSION" || {
            echo "Tag v$VERSION does not match workspace version $found" >&2
            exit 1
          }

      - name: Build npk package and manifest
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PUBLISHER: ${{ vars.NOSTR_PUBLISHER }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            PUBLISHER="manual-test-publisher"
          fi
          mkdir -p package-output
          packaging/build-npk.sh "$VERSION" "$PUBLISHER" target/release/nscript "$RUNNER_TEMP/npack/bin/npack" package-output
          bundle="nscript-mcp-${VERSION}-linux-x86_64"
          mkdir -p "$RUNNER_TEMP/$bundle/share/doc/nscript"
          install -m 0755 target/release/nscript target/release/nscript-mcp "$RUNNER_TEMP/$bundle/"
          install -m 0644 target/wasm32-unknown-unknown/release/nscript_wasm.wasm "$RUNNER_TEMP/$bundle/nscript_wasm.wasm"
          install -m 0644 README.md LICENSE docs/MCP.md "$RUNNER_TEMP/$bundle/share/doc/nscript/"
          tar -C "$RUNNER_TEMP" -czf "package-output/$bundle.tar.gz" "$bundle"
          (cd package-output && sha256sum "$bundle.tar.gz" >> SHA256SUMS)

      - name: Verify package output
        run: |
          (cd package-output && sha256sum --check SHA256SUMS)
          "$RUNNER_TEMP/npack/bin/npack" verify package-output/nscript-*.manifest.json

      - name: Attest package provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: package-output/*.npk,package-output/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: nscript-release-bundle
          path: package-output
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            package-output/*.npk
            package-output/*.manifest.json
            package-output/*.tar.gz
            package-output/SHA256SUMS

  macos-arm64:
    name: Build macOS arm64 MCP bundle
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,wasm32-unknown-unknown
      - name: Build binaries
        run: |
          cargo build --release --locked --target aarch64-apple-darwin -p nscript-cli -p nscript-mcp
          cargo build --release --locked --target wasm32-unknown-unknown -p nscript-wasm
      - name: Package macOS binaries
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.0.0-ci.{0}', github.run_number) }}
        run: |
          VERSION="${VERSION#v}"
          bundle="nscript-mcp-${VERSION}-darwin-arm64"
          mkdir -p "$RUNNER_TEMP/$bundle/share/doc/nscript" package-output
          install -m 0755 target/aarch64-apple-darwin/release/nscript target/aarch64-apple-darwin/release/nscript-mcp "$RUNNER_TEMP/$bundle/"
          install -m 0644 target/wasm32-unknown-unknown/release/nscript_wasm.wasm "$RUNNER_TEMP/$bundle/nscript_wasm.wasm"
          install -m 0644 README.md LICENSE docs/MCP.md "$RUNNER_TEMP/$bundle/share/doc/nscript/"
          tar -C "$RUNNER_TEMP" -czf "package-output/$bundle.tar.gz" "$bundle"
          (cd package-output && shasum -a 256 "$bundle.tar.gz" > "$bundle.sha256")
      - name: Attest macOS bundle provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: package-output/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: nscript-mcp-darwin-arm64
          path: package-output/*
          if-no-files-found: error

  linux-arm64:
    name: Build Linux arm64 MCP bundle
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build binaries
        run: |
          cargo build --release --locked -p nscript-cli -p nscript-mcp
          cargo build --release --locked --target wasm32-unknown-unknown -p nscript-wasm
      - name: Package Linux binaries
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.0.0-ci.{0}', github.run_number) }}
        run: |
          VERSION="${VERSION#v}"
          bundle="nscript-mcp-${VERSION}-linux-arm64"
          mkdir -p "$RUNNER_TEMP/$bundle/share/doc/nscript" package-output
          install -m 0755 target/release/nscript target/release/nscript-mcp "$RUNNER_TEMP/$bundle/"
          install -m 0644 target/wasm32-unknown-unknown/release/nscript_wasm.wasm "$RUNNER_TEMP/$bundle/nscript_wasm.wasm"
          install -m 0644 README.md LICENSE docs/MCP.md "$RUNNER_TEMP/$bundle/share/doc/nscript/"
          tar -C "$RUNNER_TEMP" -czf "package-output/$bundle.tar.gz" "$bundle"
          (cd package-output && sha256sum "$bundle.tar.gz" > "$bundle.sha256")
      - name: Attest Linux arm64 bundle provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: package-output/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: nscript-mcp-linux-arm64
          path: package-output/*
          if-no-files-found: error

  windows-x64:
    name: Build Windows x64 MCP bundle
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build binaries
        run: |
          cargo build --release --locked -p nscript-cli -p nscript-mcp
          cargo build --release --locked --target wasm32-unknown-unknown -p nscript-wasm
      - name: Package Windows binaries
        shell: pwsh
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.0.0-ci.{0}', github.run_number) }}
        run: |
          $version = $env:VERSION.TrimStart('v')
          $bundle = "nscript-mcp-$version-win-x64"
          $root = Join-Path $env:RUNNER_TEMP $bundle
          New-Item -ItemType Directory -Force -Path "$root/share/doc/nscript", package-output | Out-Null
          Copy-Item target/release/nscript.exe,target/release/nscript-mcp.exe $root
          Copy-Item target/wasm32-unknown-unknown/release/nscript_wasm.wasm $root
          Copy-Item README.md,LICENSE,docs/MCP.md "$root/share/doc/nscript/"
          Compress-Archive -Path $root -DestinationPath "package-output/$bundle.zip"
          Get-FileHash -Algorithm SHA256 "package-output/$bundle.zip" | ForEach-Object { "$($_.Hash.ToLower())  $bundle.zip" | Set-Content "package-output/$bundle.sha256" }
      - name: Attest Windows x64 bundle provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: package-output/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: nscript-mcp-win-x64
          path: package-output/*
          if-no-files-found: error

  windows-arm64:
    name: Build Windows arm64 MCP bundle
    runs-on: windows-11-arm
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build binaries
        run: |
          cargo build --release --locked -p nscript-cli -p nscript-mcp
          cargo build --release --locked --target wasm32-unknown-unknown -p nscript-wasm
      - name: Package Windows binaries
        shell: pwsh
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.0.0-ci.{0}', github.run_number) }}
        run: |
          $version = $env:VERSION.TrimStart('v')
          $bundle = "nscript-mcp-$version-win-arm64"
          $root = Join-Path $env:RUNNER_TEMP $bundle
          New-Item -ItemType Directory -Force -Path "$root/share/doc/nscript", package-output | Out-Null
          Copy-Item target/release/nscript.exe,target/release/nscript-mcp.exe $root
          Copy-Item target/wasm32-unknown-unknown/release/nscript_wasm.wasm $root
          Copy-Item README.md,LICENSE,docs/MCP.md "$root/share/doc/nscript/"
          Compress-Archive -Path $root -DestinationPath "package-output/$bundle.zip"
          Get-FileHash -Algorithm SHA256 "package-output/$bundle.zip" | ForEach-Object { "$($_.Hash.ToLower())  $bundle.zip" | Set-Content "package-output/$bundle.sha256" }
      - name: Attest Windows arm64 bundle provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: package-output/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: nscript-mcp-win-arm64
          path: package-output/*
          if-no-files-found: error

  publish-macos-release:
    name: Attach macOS release bundle
    needs: [package, macos-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nscript-mcp-darwin-arm64
          path: package-output
      - name: Upload GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" package-output/* --clobber

  publish-additional-platforms:
    name: Attach Linux and Windows release bundles
    needs: [package, linux-arm64, windows-x64, windows-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nscript-mcp-linux-arm64
          path: package-output/linux-arm64
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: nscript-mcp-win-x64
          path: package-output/win-x64
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: nscript-mcp-win-arm64
          path: package-output/win-arm64
          merge-multiple: true
      - name: Upload GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: find package-output -type f -print0 | xargs -0 gh release upload "$TAG" --clobber

  publish-npm:
    name: Publish npm package
    needs: [package, macos-arm64, linux-arm64, windows-x64, windows-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update npm for trusted publishing
        run: npm install --global npm@latest
      - uses: actions/download-artifact@v4
        with:
          name: nscript-release-bundle
          path: release-linux
      - uses: actions/download-artifact@v4
        with:
          name: nscript-mcp-darwin-arm64
          path: release-macos
      - uses: actions/download-artifact@v4
        with:
          name: nscript-mcp-linux-arm64
          path: release-linux-arm64
      - uses: actions/download-artifact@v4
        with:
          name: nscript-mcp-win-x64
          path: release-win-x64
      - uses: actions/download-artifact@v4
        with:
          name: nscript-mcp-win-arm64
          path: release-win-arm64
      - name: Assemble npm package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          staging="$RUNNER_TEMP/npm-package"
          mkdir -p "$staging/bin/linux-x64" "$staging/bin/linux-arm64" "$staging/bin/darwin-arm64" "$staging/bin/win-x64" "$staging/bin/win-arm64"
          cp npm/nscript-mcp/package.json npm/nscript-mcp/README.md "$staging/"
          cp npm/nscript-mcp/bin/nscript-mcp.js npm/nscript-mcp/bin/nscript.js "$staging/bin/"
          cp LICENSE "$staging/"
          tar -xzf "release-linux/nscript-mcp-${VERSION}-linux-x86_64.tar.gz" -C "$RUNNER_TEMP"
          tar -xzf "release-macos/nscript-mcp-${VERSION}-darwin-arm64.tar.gz" -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/nscript-mcp-${VERSION}-linux-x86_64/nscript" "$RUNNER_TEMP/nscript-mcp-${VERSION}-linux-x86_64/nscript-mcp" "$RUNNER_TEMP/nscript-mcp-${VERSION}-linux-x86_64/nscript_wasm.wasm" "$staging/bin/linux-x64/"
          cp "$RUNNER_TEMP/nscript-mcp-${VERSION}-darwin-arm64/nscript" "$RUNNER_TEMP/nscript-mcp-${VERSION}-darwin-arm64/nscript-mcp" "$RUNNER_TEMP/nscript-mcp-${VERSION}-darwin-arm64/nscript_wasm.wasm" "$staging/bin/darwin-arm64/"
          tar -xzf "release-linux-arm64/nscript-mcp-${VERSION}-linux-arm64.tar.gz" -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/nscript-mcp-${VERSION}-linux-arm64/nscript" "$RUNNER_TEMP/nscript-mcp-${VERSION}-linux-arm64/nscript-mcp" "$RUNNER_TEMP/nscript-mcp-${VERSION}-linux-arm64/nscript_wasm.wasm" "$staging/bin/linux-arm64/"
          unzip "release-win-x64/nscript-mcp-${VERSION}-win-x64.zip" -d "$RUNNER_TEMP/win-x64"
          cp "$RUNNER_TEMP/win-x64/nscript-mcp-${VERSION}-win-x64/nscript.exe" "$RUNNER_TEMP/win-x64/nscript-mcp-${VERSION}-win-x64/nscript-mcp.exe" "$RUNNER_TEMP/win-x64/nscript-mcp-${VERSION}-win-x64/nscript_wasm.wasm" "$staging/bin/win-x64/"
          unzip "release-win-arm64/nscript-mcp-${VERSION}-win-arm64.zip" -d "$RUNNER_TEMP/win-arm64"
          cp "$RUNNER_TEMP/win-arm64/nscript-mcp-${VERSION}-win-arm64/nscript.exe" "$RUNNER_TEMP/win-arm64/nscript-mcp-${VERSION}-win-arm64/nscript-mcp.exe" "$RUNNER_TEMP/win-arm64/nscript-mcp-${VERSION}-win-arm64/nscript_wasm.wasm" "$staging/bin/win-arm64/"
          chmod 0755 "$staging/bin/nscript-mcp.js" "$staging/bin/nscript.js" "$staging/bin/linux-x64/"* "$staging/bin/linux-arm64/"* "$staging/bin/darwin-arm64/"*
          node -e "const fs=require('fs'),p='$staging/package.json';const j=JSON.parse(fs.readFileSync(p));j.version='$VERSION';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\\n')"
          cd "$staging"
          npm pack --dry-run
          npm publish --provenance --access public

  nostr-handoff:
    name: Publish to Nostr
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      contents: read
    steps:
      - uses: dtolnay/rust-toolchain@stable

      - name: Install npack
        run: cargo install --git https://github.com/imattau/npack --tag "$NPACK_REF" --locked --root "$RUNNER_TEMP/npack" npack

      - uses: actions/download-artifact@v4
        with:
          name: nscript-release-bundle
          path: package-output

      - name: Publish artifact and events
        env:
          NOSTR_SECRET_KEY: ${{ secrets.NOSTR_SECRET_KEY }}
          NOSTR_RELAYS: ${{ vars.NOSTR_RELAYS }}
          NOSTR_BLOSSOM_SERVERS: ${{ vars.NOSTR_BLOSSOM_SERVERS }}
        run: |
          test -n "$NOSTR_SECRET_KEY" || { echo "The release environment must define NOSTR_SECRET_KEY" >&2; exit 1; }
          # Default project relays; set the NOSTR_RELAYS variable to override.
          if [[ -z "${NOSTR_RELAYS//[[:space:]]/}" ]]; then
            NOSTR_RELAYS=$'wss://relay.ditto.pub\nwss://nostr-01.yakihonne.com\nwss://relay.primal.net'
          fi
          relay_args=()
          while IFS= read -r relay; do
            [[ -z "${relay//[[:space:]]/}" ]] && continue
            relay_args+=(--relay "$relay")
          done <<< "$NOSTR_RELAYS"
          # The GitHub Release asset is the primary download (--artifact-url
          # below); these Blossom servers are mirrors. Set the
          # NOSTR_BLOSSOM_SERVERS variable to override.
          if [[ -z "${NOSTR_BLOSSOM_SERVERS//[[:space:]]/}" ]]; then
            NOSTR_BLOSSOM_SERVERS=$'https://blossom.ditto.pub\nhttps://blossom.primal.net'
          fi
          server_args=()
          while IFS= read -r server; do
            [[ -z "${server//[[:space:]]/}" ]] && continue
            server_args+=(--server "$server")
          done <<< "$NOSTR_BLOSSOM_SERVERS"
          test "${#relay_args[@]}" -gt 0 || { echo "The repository must define NOSTR_RELAYS" >&2; exit 1; }
          test "${#server_args[@]}" -gt 0 || { echo "The repository must define NOSTR_BLOSSOM_SERVERS" >&2; exit 1; }
          manifest=$(ls package-output/nscript-*.manifest.json)
          artifact=$(jq -r '.artifact' "$manifest")
          artifact_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${artifact}"
          # Never sign a URL that does not serve exactly the bytes we built.
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/check.npk" "$artifact_url"
          cmp "$RUNNER_TEMP/check.npk" "package-output/$artifact"
          "$RUNNER_TEMP/npack/bin/npack" publish "$manifest" \
            --secret-key "$NOSTR_SECRET_KEY" \
            "${relay_args[@]}" "${server_args[@]}" \
            --artifact-url "$artifact_url"
