[workspace]
members = [
    "crates/nscript-cli",
    "crates/nscript-host-crypto",
    "crates/nscript-ir",
    "crates/nscript-modules",
    "crates/nscript-semantics",
    "crates/nscript-syntax",
    "crates/nscript-runtime",
    "crates/nscript-wasm",
    "crates/nscript-lang",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/imattau/nscript"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
semver = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1"
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
unicode-ident = "1"
