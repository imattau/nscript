[workspace]
members = [
    "crates/nscript-cli",
    "crates/nscript-ir",
    "crates/nscript-modules",
    "crates/nscript-semantics",
    "crates/nscript-syntax",
    "crates/nscript-runtime",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/imattau/nscript"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
semver = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
unicode-ident = "1"
